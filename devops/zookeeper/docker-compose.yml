      - ./node2-data:/var/lib/clickhouse
      - ./configs/node2/config.xml:/etc/clickhouse-server/config.xml
      - ./configs/node2/users.xml:/etc/clickhouse-server/users.xml
      - ./configs/metrika.xml:/etc/clickhouse-server/metrika.xml
      - ./configs/macros/macros-node2.xml:/etc/clickhouse-server/config.d/macros.xml
    depends_on:
      - zookeeper
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  clickhouse-node3:

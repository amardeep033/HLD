    hostname: clickhouse-node3
    ports:
      - "8125:8123"
      - "9002:9000"
      - "9011:9009"
    volumes:
      - ./node3-data:/var/lib/clickhouse
      - ./configs/node3/config.xml:/etc/clickhouse-server/config.xml
      - ./configs/node3/users.xml:/etc/clickhouse-server/users.xml
      - ./configs/metrika.xml:/etc/clickhouse-server/metrika.xml
      - ./configs/macros/macros-node3.xml:/etc/clickhouse-server/config.d/macros.xml
    depends_on:

services:
  zookeeper:
    image: zookeeper:3.7
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    volumes:
      - ./zookeeper-data:/data
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper:2888:3888;2181
  clickhouse-node1:
    image: clickhouse/clickhouse-server:25.3
    container_name: clickhouse-node1
    hostname: clickhouse-node1
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    volumes:
      - ./node1-data:/var/lib/clickhouse
      - ./configs/node1/config.xml:/etc/clickhouse-server/config.xml
      - ./configs/node1/users.xml:/etc/clickhouse-server/users.xml
      - ./configs/metrika.xml:/etc/clickhouse-server/metrika.xml
      - ./configs/macros/macros-node1.xml:/etc/clickhouse-server/config.d/macros.xml
    depends_on:
      - zookeeper
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  clickhouse-node2:
    image: clickhouse/clickhouse-server:25.3
    container_name: clickhouse-node2
    hostname: clickhouse-node2
    ports:
      - "8124:8123"

[package]
name = "redis_hld"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
redis = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
